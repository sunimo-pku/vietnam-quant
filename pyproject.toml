[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vietnam-quant"
version = "0.1.0"
description = "Evidence-preserving Vietnam exchange status collection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "truststore>=0.10,<1",
    "tzdata>=2025.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["ruff==0.14.1"]

[project.scripts]
vn-status = "vietnam_quant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
